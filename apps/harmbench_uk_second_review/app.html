<!doctype html>
<meta charset="utf-8">
<title>Khrystyna · independent translation review</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#191e27;--line:#303744;--ink:#edf0f5;--muted:#a7b0bf;--blue:#6395d6;--green:#59ad78;--red:#df7168;--amber:#d6a24f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#131720;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0}.muted{color:var(--muted)}.progress{margin-left:auto}main{display:grid;grid-template-columns:260px minmax(0,1fr);height:calc(100vh - 58px)}nav{overflow:auto;border-right:1px solid var(--line)}nav button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);padding:9px 12px;cursor:pointer}nav button[aria-current=true]{background:#202735;border-left:3px solid var(--blue)}nav .done{color:var(--green)}nav .fix{color:var(--amber)}#content{overflow:auto;padding:20px}.panel{max-width:1200px;margin:0 auto 16px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px}.pair{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:10px 0}.cell{padding:12px;min-width:0}.cell:first-child{border-right:1px solid var(--line);background:#151922}.label{text-transform:uppercase;letter-spacing:.06em;font-size:10px;color:var(--muted);margin-bottom:5px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:9px;margin-top:14px}button.action{border:0;border-radius:6px;padding:10px 15px;color:white;background:var(--blue);font-weight:650;cursor:pointer}.actions button{flex:1}.accept{background:#378655!important}.reject{background:#9b4a45!important}.form{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.form.open{display:block}textarea,select{width:100%;background:#0e1117;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}textarea{min-height:76px;resize:vertical}.form label{display:block;color:var(--muted);font-size:12px;margin:9px 0 4px}.dims{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}.msg{min-height:22px;margin-top:9px}.error{color:var(--red)}.ok{color:var(--green)}kbd{background:#2b303c;border-radius:3px;padding:1px 5px}.help{color:var(--muted);max-width:850px}
@media(max-width:850px){main{grid-template-columns:1fr;height:auto}nav{max-height:230px;border-right:0;border-bottom:1px solid var(--line)}.pair{grid-template-columns:1fr}.cell:first-child{border-right:0;border-bottom:1px solid var(--line)}.dims{grid-template-columns:1fr}}
</style>
<header><h1>Khrystyna · independent bilingual review</h1><span class="muted"><kbd>Y</kbd> accept · <kbd>N</kbd> needs fix · <kbd>J</kbd>/<kbd>K</kbd> move</span><div class="progress" id="summary">Loading…</div></header>
<main><nav id="list"></nav><section id="content"><p class="muted">Loading private review queue…</p></section></main>
<script>
const TOKEN="__SESSION_TOKEN__";
const LABELS={semantic_equivalence:"Semantic equivalence",naturalness:"Naturalness",category_match:"Category match",rubric_match:"Rubric match",expected_behavior_match:"Expected-behaviour match"};
let STATE=null,SCHEMA=null,current=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"X-Second-Review-Token":TOKEN,...(opts.body?{"Content-Type":"application/json"}:{}),...(opts.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}
function item(){return STATE.items.find(x=>x.pair_id===current)}
function fields(title,en,uk){if(en==null&&uk==null)return"";return `<div class="pair"><div class="cell"><div class="label">English · ${esc(title)}</div><div class="text">${esc(en||"")}</div></div><div class="cell"><div class="label">Ukrainian · ${esc(title)}</div><div class="text">${esc(uk||"")}</div></div></div>`}
function renderList(){const list=document.getElementById("list");list.innerHTML=STATE.items.map(x=>{const r=x.review,mark=!r?"○":r.verdict==="accept"?"✓":"!";return `<button data-pair="${esc(x.pair_id)}" aria-current="${x.pair_id===current}" class="${r?.verdict==="accept"?"done":r?"fix":""}">${mark} ${String(x.position).padStart(3,"0")} · ${esc(x.category)}<br><span class="muted">${esc(x.pair_id.replace("harmbench:",""))}</span></button>`}).join("");list.querySelectorAll("button").forEach(b=>b.onclick=()=>{current=b.dataset.pair;render()});const s=STATE.summary;document.getElementById("summary").textContent=`${s.completed}/${s.total} reviewed · ${s.remaining} open · ${s.needs_fix} need fix`}
function rejectForm(x){const dims=SCHEMA.dimensions.map(d=>`<label>${esc(LABELS[d]||d)}<select data-dim="${esc(d)}"><option value="pass">pass</option><option value="fail">fail</option><option value="not_judgeable">not judgeable</option></select></label>`).join("");const u=x.ukrainian;return `<div class="form" id="reject-form"><h3>Describe and propose the correction</h3><div class="dims">${dims}</div><label>Corrected Ukrainian prompt</label><textarea data-field="prompt_text">${esc(u.prompt_text)}</textarea>${x.english.context_text!==null?`<label>Corrected Ukrainian context</label><textarea data-field="context_text">${esc(u.context_text||"")}</textarea>`:""}<label>Corrected Ukrainian rubric</label><textarea data-field="rubric_text">${esc(u.rubric_text)}</textarea><label>Required rationale</label><textarea data-notes placeholder="What is wrong and why is the proposed wording faithful?"></textarea><div class="actions"><button class="action reject" id="save-reject">Save needs-fix review</button><button class="action" id="cancel">Cancel</button></div></div>`}
function render(){renderList();const x=item(),root=document.getElementById("content");if(!x){root.innerHTML='<p class="muted">No review items.</p>';return}const r=x.review;root.innerHTML=`<div class="panel"><div class="muted">#${x.position} · ${esc(x.pair_id)} · ${esc(x.category)} · expected ${esc(x.expected_behavior)}</div><h2>Compare the final Ukrainian translation with its English source</h2><p class="help">Make your own judgement. The first reviewer’s decision, notes, sampling reason, and English/Ukrainian experiment outcomes are intentionally hidden.</p>${fields("prompt",x.english.prompt_text,x.ukrainian.prompt_text)}${fields("context",x.english.context_text,x.ukrainian.context_text)}${fields("rubric",x.english.rubric_text,x.ukrainian.rubric_text)}${r?`<p class="msg ${r.verdict==="accept"?"ok":"error"}">Saved: ${esc(r.verdict.replace("_"," "))}</p>`:""}<div class="actions"><button class="action accept" id="accept" ${r?"disabled":""}>Accept translation (Y)</button><button class="action reject" id="reject">${r?"Revise review / needs fix":"Needs fix (N)"}</button></div><div class="msg" id="msg"></div>${rejectForm(x)}</div>`;document.getElementById("accept").onclick=accept;document.getElementById("reject").onclick=openReject;document.getElementById("cancel").onclick=()=>document.getElementById("reject-form").classList.remove("open");document.getElementById("save-reject").onclick=saveReject}
function allPass(){return Object.fromEntries(SCHEMA.dimensions.map(d=>[d,"pass"]))}
async function accept(){const x=item();try{STATE=await api("/api/review",{method:"POST",body:JSON.stringify({pair_id:x.pair_id,reviewer_id:STATE.reviewer_id,verdict:"accept",dimensions:allPass(),notes:"",subject_sha256:x.subject_sha256})});nextOpen()}catch(e){document.getElementById("msg").innerHTML=`<span class="error">${esc(e.message)}</span>`}}
function openReject(){const f=document.getElementById("reject-form");f.classList.add("open");f.querySelector("select")?.focus();f.scrollIntoView({block:"nearest"})}
async function saveReject(){const x=item(),f=document.getElementById("reject-form"),dimensions=Object.fromEntries([...f.querySelectorAll("[data-dim]")].map(e=>[e.dataset.dim,e.value]));const correction={prompt_text:f.querySelector('[data-field="prompt_text"]').value,context_text:f.querySelector('[data-field="context_text"]')?.value??null,rubric_text:f.querySelector('[data-field="rubric_text"]').value};try{STATE=await api("/api/review",{method:"POST",body:JSON.stringify({pair_id:x.pair_id,reviewer_id:STATE.reviewer_id,verdict:"needs_fix",dimensions,notes:f.querySelector("[data-notes]").value,suggested_correction:correction,subject_sha256:x.subject_sha256})});nextOpen()}catch(e){document.getElementById("msg").innerHTML=`<span class="error">${esc(e.message)}</span>`}}
function step(delta){const i=STATE.items.findIndex(x=>x.pair_id===current),n=Math.max(0,Math.min(STATE.items.length-1,i+delta));current=STATE.items[n].pair_id;render();document.querySelector(`nav button[data-pair="${CSS.escape(current)}"]`)?.scrollIntoView({block:"nearest"})}
function nextOpen(){const start=STATE.items.findIndex(x=>x.pair_id===current),next=STATE.items.slice(start+1).find(x=>!x.review)||STATE.items.find(x=>!x.review);current=next?.pair_id??current;render()}
document.addEventListener("keydown",e=>{const tag=e.target.tagName?.toLowerCase();if(e.repeat||e.ctrlKey||e.altKey||e.metaKey||e.target.isContentEditable||["input","select","textarea"].includes(tag))return;const k=e.key.toLowerCase();if(k==="y")accept();else if(k==="n")openReject();else if(k==="j")step(1);else if(k==="k")step(-1);else return;e.preventDefault()});
(async()=>{[SCHEMA,STATE]=await Promise.all([api("/api/schema"),api("/api/state")]);current=STATE.items.find(x=>!x.review)?.pair_id??STATE.items[0]?.pair_id??null;render()})().catch(e=>document.getElementById("content").innerHTML=`<p class="error">${esc(e.message)}</p>`);
</script>
