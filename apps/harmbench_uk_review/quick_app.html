<!doctype html>
<meta charset="utf-8">
<title>Quick Ukrainian HarmBench review</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#191e27;--line:#303744;--ink:#edf0f5;--muted:#a7b0bf;--blue:#6395d6;--green:#59ad78;--red:#df7168;--amber:#d6a24f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:#131720;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0}.muted{color:var(--muted)}.progress{margin-left:auto}.bar{width:180px;height:7px;background:#303744;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
main{max-width:1500px;margin:auto;padding:18px}.rubric-review{background:var(--panel);border:1px solid var(--amber);border-radius:10px;padding:14px;margin-bottom:16px}.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.card.active{outline:2px solid var(--blue);outline-offset:2px}.card.done{border-color:var(--green)}
.head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}.head strong{font-size:13px}.tag{padding:2px 7px;border-radius:10px;background:#293241;color:var(--muted);font-size:11px}.verdict{margin-left:auto;color:var(--green);font-weight:650}.verdict.fix{color:var(--amber)}
.content{padding:14px}.field{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:10px}.cell{min-width:0;padding:10px}.cell:first-child{border-right:1px solid var(--line);background:#151922}.label{text-transform:uppercase;letter-spacing:.06em;font-size:10px;color:var(--muted);margin-bottom:5px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.why{border-left:3px solid var(--amber);padding:7px 10px;margin:10px 0;color:var(--muted);background:#151922}
.actions{display:flex;gap:8px;margin-top:13px}button{border:0;border-radius:6px;padding:9px 13px;color:white;background:var(--blue);font-weight:650;cursor:pointer}button.secondary{background:#394251}button.good{background:#378655}button:disabled{opacity:.5;cursor:not-allowed}.edit{display:none;border-top:1px solid var(--line);padding:14px}.edit.open{display:block}textarea,select,input{width:100%;background:#0e1117;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}textarea{min-height:72px;resize:vertical}.edit label{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}.dims{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}.msg{min-height:22px;margin-top:9px;color:var(--muted)}.error{color:var(--red)}.ok{color:var(--green)}.controls{display:flex;gap:8px;align-items:center}.controls select{width:120px}.controls input{width:220px}
footer{display:flex;justify-content:center;gap:10px;padding:18px}footer button{min-width:130px}@media(max-width:950px){.pair-grid{grid-template-columns:1fr}.field{grid-template-columns:1fr}.cell:first-child{border-right:0;border-bottom:1px solid var(--line)}}
</style>
<header><h1>Ukrainian HarmBench · translation review</h1><span class="muted">English source + current Ukrainian · <kbd>Y</kbd> accept · <kbd>N</kbd> fix</span><div class="controls"><select id="view"><option value="open">Open items</option><option value="all">All items</option><option value="done">Reviewed items</option><option value="changed">Corrected items</option></select><input id="search" type="search" placeholder="Search pair ID or category"></div><div class="progress"><span id="count">Loading…</span><div class="bar"><i id="fill"></i></div></div></header>
<main><section id="rubrics"></section><div id="cards" class="pair-grid"></div><footer><button class="secondary" id="prev">← Previous two</button><button id="next">Next open two →</button></footer></main>
<script>
const TOKEN = "__SESSION_TOKEN__";
const DIMS={semantic_equivalence:"Semantic equivalence",naturalness:"Naturalness",category_match:"Category match",expected_behavior_match:"Expected behaviour"};
let STATE,SCHEMA,page=0,activePair=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"X-Review-App-Token":TOKEN,...(opts.body?{"Content-Type":"application/json"}:{}),...(opts.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}
function recommendation(r){return r.disposition==="propose_correction"?"accept_proposal":"accept_deepl"}
function recommendedText(r){return recommendation(r)==="accept_proposal"?r.proposed:r.machine_deepl}
function rationales(r){const rr=r.rationale||{};return Object.entries(rr).filter(([,v])=>v&&v.note).map(([k,v])=>`<div class="why"><b>${esc(k.replace("_"," "))} · ${esc(v.severity)}</b><br>${esc(v.note)}</div>`).join("")||'<div class="why">No correction is preselected. Compare the current Ukrainian translation with the English source and make your own decision.</div>'}
function field(title,en,uk){if(en==null&&uk==null)return"";return `<div class="field"><div class="cell"><div class="label">English · ${esc(title)}</div><div class="text">${esc(en||"")}</div></div><div class="cell"><div class="label">Current Ukrainian · ${esc(title)}</div><div class="text">${esc(uk||"")}</div></div></div>`}
function editPanel(r){const t=recommendedText(r);const dims=Object.entries(DIMS).map(([k,v])=>`<label>${esc(v)}<select data-dim="${k}"><option value="pass">pass</option><option value="fail">fail</option><option value="not_judgeable">not judgeable</option></select></label>`).join("");return `<div class="edit" id="edit-${esc(r.index)}"><b>Replace Ukrainian prompt or disagree with a prompt dimension</b><label>Ukrainian prompt</label><textarea data-field="prompt_text">${esc(t.prompt_text)}</textarea>${r.machine_deepl.context_text!==null?`<label>Ukrainian context</label><textarea data-field="context_text">${esc(t.context_text||"")}</textarea>`:""}<div class="dims">${dims}</div><label>Required rationale</label><textarea data-rationale placeholder="What is invalid, and why is this correction faithful?"></textarea><div class="actions"><button data-save-edit>Save correction / disagreement</button><button class="secondary" data-cancel>Cancel</button></div></div>`}
function card(r){const d=STATE.decisions[r.pair_id],t=recommendedText(r),fix=recommendation(r)==="accept_proposal",rubricReady=STATE.rubrics.every(x=>STATE.rubric_reviews[x.rubric_id]);return `<article class="card ${d?"done":""}" data-pair="${esc(r.pair_id)}"><div class="head"><strong>#${String(r.index).padStart(3,"0")} · ${esc(r.pair_id)}</strong><span class="tag">${esc(r.category)}</span><span class="verdict ${fix?"fix":""}">${d?"Reviewed":fix?"Correction proposed":"Human review required"}</span></div><div class="content">${field("prompt",r.english.prompt_text,t.prompt_text)}${field("context",r.english.context_text,t.context_text)}${rationales(r)}<div class="actions"><button class="good" data-agree ${(d||!rubricReady)?"disabled":""}>${d?"Decision saved":rubricReady?"Approve current translation":"Approve shared rubric first"}</button><button class="secondary" data-edit>${d?"Revise decision / translation":"Translation is not valid / edit"}</button></div><div class="msg">${d?`Saved as ${esc(d.selection.replaceAll("_"," "))}`:""}</div></div>${editPanel(r)}</article>`}
function filteredRecords(){const view=document.getElementById("view").value,q=document.getElementById("search").value.trim().toLowerCase();return STATE.records.filter(r=>{const d=STATE.decisions[r.pair_id];if(view==="open"&&d)return false;if(view==="done"&&!d)return false;if(view==="changed"&&(!d||!d.changed_from_machine))return false;return !q||r.pair_id.toLowerCase().includes(q)||r.category.toLowerCase().includes(q)})}
function visible(){const records=filteredRecords(),start=page*2;if(start>=records.length&&page){page=0;return records.slice(0,2)}return records.slice(start,start+2)}
function renderRubrics(){document.getElementById("rubrics").innerHTML=STATE.rubrics.map(r=>{const d=STATE.rubric_reviews[r.rubric_id];return `<div class="rubric-review"><div class="head"><strong>Shared rubric pair · reviewed once for all ${STATE.summary.total} prompts</strong><span class="verdict">${d?"Approved":"Separate approval needed"}</span></div>${field("rubric",r.english,r.ukrainian)}<label class="muted">Optional approval rationale</label><textarea data-rubric-note placeholder="Assumed prompt-independent and equivalent.">${esc(d?.rationale||"")}</textarea><div class="actions"><button class="good" data-rubric-approve data-id="${r.rubric_id}" ${d?"disabled":""}>${d?"Rubric pair approved":"Approve rubric pair"}</button></div></div>`}).join("");document.querySelectorAll("[data-rubric-approve]").forEach(b=>b.onclick=async()=>{STATE=await api("/api/rubric-approval",{method:"POST",body:JSON.stringify({rubric_id:b.dataset.id,reviewer_id:STATE.reviewer_id,rationale:b.closest(".rubric-review").querySelector("[data-rubric-note]").value})});render()})}
function render(){renderRubrics();const records=filteredRecords(),rows=visible();if(!rows.some(r=>r.pair_id===activePair))activePair=rows[0]?.pair_id??null;document.getElementById("cards").innerHTML=rows.map(card).join("")||'<p>No items match this view.</p>';document.getElementById("count").textContent=`${STATE.summary.completed}/${STATE.summary.total} reviewed · ${STATE.summary.remaining} open · ${records.length} shown`;document.getElementById("fill").style.width=`${100*STATE.summary.completed/STATE.summary.total}%`;bind();paintActive()}
function payload(r,selection,dimensions,notes,manual){return {pair_id:r.pair_id,reviewer_id:STATE.reviewer_id,selection,dimensions,notes,manual_fields:manual,machine_content_sha256:r.machine_content_sha256,proposal_content_sha256:r.proposal_content_sha256}}
async function save(card,body){const msg=card.querySelector(".msg");try{STATE=await api("/api/decision",{method:"POST",body:JSON.stringify(body)});msg.innerHTML='<span class="ok">Saved</span>';page=0;render()}catch(e){msg.innerHTML=`<span class="error">${esc(e.message)}</span>`}}
function paintActive(){document.querySelectorAll(".card").forEach(card=>card.classList.toggle("active",card.dataset.pair===activePair))}
function activate(card){activePair=card.dataset.pair;paintActive()}
function openFix(card){activate(card);const edit=card.querySelector(".edit");edit.classList.add("open");edit.querySelector('[data-field="prompt_text"]')?.focus();edit.scrollIntoView({block:"nearest"})}
function bind(){document.querySelectorAll(".card").forEach(card=>{const r=STATE.records.find(x=>x.pair_id===card.dataset.pair);card.addEventListener("pointerdown",()=>activate(card));card.querySelector("[data-agree]").onclick=()=>save(card,payload(r,recommendation(r),{...Object.fromEntries(Object.keys(DIMS).map(k=>[k,"pass"])),rubric_match:"pass"},"Human verified the current translation; shared rubric reviewed separately.",null));const edit=card.querySelector(".edit");card.querySelector("[data-edit]").onclick=()=>openFix(card);card.querySelector("[data-cancel]").onclick=()=>edit.classList.remove("open");card.querySelector("[data-save-edit]").onclick=()=>{const rationale=edit.querySelector("[data-rationale]").value.trim();if(!rationale){card.querySelector(".msg").innerHTML='<span class="error">A rationale is required for a correction or disagreement.</span>';return}const t=recommendedText(r);const manual={prompt_text:edit.querySelector('[data-field="prompt_text"]').value,context_text:r.machine_deepl.context_text===null?null:edit.querySelector('[data-field="context_text"]').value,rubric_text:t.rubric_text};const dimensions={...Object.fromEntries([...edit.querySelectorAll("[data-dim]")].map(x=>[x.dataset.dim,x.value])),rubric_match:"pass"};save(card,payload(r,"edit_manual",dimensions,rationale,manual))}})}
document.addEventListener("keydown",event=>{const tag=event.target.tagName?.toLowerCase();if(event.repeat||event.ctrlKey||event.altKey||event.metaKey||event.target.isContentEditable||["input","select","textarea"].includes(tag))return;const key=event.key.toLowerCase();if(key!=="y"&&key!=="n")return;const card=[...document.querySelectorAll(".card")].find(x=>x.dataset.pair===activePair);if(!card)return;if(key==="y"){const agree=card.querySelector("[data-agree]");if(!agree.disabled)agree.click()}else openFix(card);event.preventDefault()});
document.getElementById("next").onclick=()=>{page++;render()};document.getElementById("prev").onclick=()=>{page=Math.max(0,page-1);render()};
document.getElementById("view").onchange=()=>{page=0;render()};document.getElementById("search").oninput=()=>{page=0;render()};
(async()=>{[SCHEMA,STATE]=await Promise.all([api("/api/schema"),api("/api/state")]);render()})().catch(e=>document.getElementById("cards").innerHTML=`<p class="error">${esc(e.message)}</p>`);
</script>
