<!doctype html><meta charset="utf-8"><title>Blind HarmBench response review</title>
<style>
body{font:16px system-ui;max-width:1100px;margin:auto;padding:18px;color:#222}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #bbb;padding:10px 0;z-index:2}.muted{color:#666}.panel{border:1px solid #bbb;border-radius:8px;padding:18px;margin:18px 0}.content{white-space:pre-wrap;background:#f6f6f6;padding:14px;border-radius:6px;max-height:330px;overflow:auto}button{padding:10px 16px;margin:5px}.selected{outline:3px solid #333}textarea{width:100%;min-height:70px}select{padding:7px}.error{color:#a00}.ok{color:#075}kbd{background:#eee;padding:2px 5px}
</style>
<header><h1>Blind response-label review</h1><div id="summary">Loading…</div><div class="muted">Automated labels and sampling reasons are hidden. <kbd>1</kbd> refused · <kbd>2</kbd> partial · <kbd>3</kbd> complied · <kbd>S</kbd> save</div></header>
<main id="root"></main>
<script>
const TOKEN="__TOKEN__";let STATE,INDEX=0,LABEL=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"X-Review-Token":TOKEN,...(opts.body?{"Content-Type":"application/json"}:{}),...(opts.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}
function openItems(){return STATE.items.filter(x=>!x.review)}
function current(){const a=openItems();if(INDEX>=a.length)INDEX=Math.max(0,a.length-1);return a[INDEX]}
function choose(v){LABEL=v;document.querySelectorAll('[data-label]').forEach(b=>b.classList.toggle('selected',b.dataset.label===v));document.getElementById('subtype').disabled=v!=="partial"}
function render(){const s=STATE.summary;document.getElementById('summary').textContent=`Reviewer ${STATE.reviewer_id} · ${s.completed}/${s.total} completed · ${s.remaining} remaining`;const x=current(),root=document.getElementById('root');if(!x){root.innerHTML='<div class="panel ok"><h2>Queue complete</h2><p>Keep the progress file private and return it to the study team.</p></div>';return}LABEL=null;root.innerHTML=`<div class="panel"><div class="muted">#${x.position} · ${esc(x.annotation_id)} · ${esc(x.language)} · ${esc(x.category)}</div><h3>Requested behaviour</h3><div class="content">${esc(x.requested_behavior)}</div><h3>Decision rubric</h3><div class="content">${esc(x.rubric)}</div><h3>Target response</h3><div class="content">${esc(x.target_response)}</div><h3>Your independent label</h3><button data-label="refused">1 · refused</button><button data-label="partial">2 · partial</button><button data-label="complied">3 · complied</button><p><label>Confidence <select id="confidence"><option>high</option><option>medium</option><option>low</option></select></label> <label>Partial subtype <select id="subtype" disabled><option value="">Select…</option><option>usable_but_incomplete</option><option>hedged_but_enabling</option><option>began_then_stopped</option><option>ambiguous_boundary</option><option>other</option></select></label></p><label>Optional notes<textarea id="notes"></textarea></label><p><button id="save">Save and continue (S)</button> <span id="msg"></span></p></div>`;document.querySelectorAll('[data-label]').forEach(b=>b.onclick=()=>choose(b.dataset.label));document.getElementById('save').onclick=save}
async function save(){const x=current(),msg=document.getElementById('msg');try{if(!LABEL)throw Error('Choose a label.');const subtype=document.getElementById('subtype').value||null;STATE=await api('/api/review',{method:'POST',body:JSON.stringify({annotation_id:x.annotation_id,reviewer_id:STATE.reviewer_id,label:LABEL,confidence:document.getElementById('confidence').value,partial_subtype:subtype,notes:document.getElementById('notes').value,subject_sha256:x.subject_sha256})});render()}catch(e){msg.className='error';msg.textContent=e.message}}
document.addEventListener('keydown',e=>{if(e.target.matches('textarea,input,select'))return;if(e.key==='1')choose('refused');else if(e.key==='2')choose('partial');else if(e.key==='3')choose('complied');else if(e.key.toLowerCase()==='s')save()});
api('/api/state').then(x=>{STATE=x;render()}).catch(e=>document.getElementById('root').textContent=e.message);
</script>
