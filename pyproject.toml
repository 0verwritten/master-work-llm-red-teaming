[project]
name = "research-harness"
version = "0.1.0"
description = "Reproducible self-adversarial LLM red-teaming research harness"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "httpx>=0.28,<1",
    "modal[api-proxy-support]>=1.4,<2",
    "pillow>=11,<12",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.16,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12,<1",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
research-harness = "harness.cli:app"
research-scheduler = "apps.scheduler.main:main"
telegram-reporter = "apps.telegram_reporter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "apps"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
